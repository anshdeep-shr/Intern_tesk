version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pms_postgres
    restart: always
    environment:
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_password
      POSTGRES_DB: pms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://pms_user:pms_password@postgres:5432/pms_db?schema=public"
      JWT_SECRET: "docker-super-secret-jwt-key"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    depends_on:
      - postgres

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pms_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
